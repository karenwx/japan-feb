name = "japan-feb"
main = "worker.js"
compatibility_date = "2025-05-01"
workers_dev = true

routes = [
  { pattern = "karenwang.org/projects/japan-feb", zone_name = "karenwang.org" },
  { pattern = "karenwang.org/projects/japan-feb/*", zone_name = "karenwang.org" }
]

# Bundle the page, manifest, and icon into the Worker as text modules
# (`import HTML from './public/index.html'`, etc.).
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.json", "**/*.svg"]
fallthrough = false

[vars]
BASE_PATH = "/projects/japan-feb"

# ----------------------------------------------------------------------------
# Preview environment — the `develop` branch deploys here (workers.dev only,
# no production routes, served at root so BASE_PATH is empty).
# ----------------------------------------------------------------------------
[env.develop]
name = "japan-feb-dev"
workers_dev = true
routes = []

[[env.develop.rules]]
type = "Text"
globs = ["**/*.html", "**/*.json", "**/*.svg"]
fallthrough = false

[env.develop.vars]
BASE_PATH = ""
